<!DOCTYPE html>

<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>내 프로젝트 - Project Collab</title>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#245C45',
              hover: '#1c4937',
              light: '#eef4f1'
            },
            surface: {
              base: '#FFFFFF',
              subtle: '#F7F8F7'
            },
            line: '#DDE2DE',
            txt: {
              main: '#202622',
              muted: '#626B64'
            }
          },
          borderRadius: {
            DEFAULT: "0.125rem",
            lg: "0.25rem",
            xl: "0.5rem",
            full: "0.75rem"
          },
          fontFamily: {
            sans: ['"Noto Sans KR"', 'sans-serif'],
            headline: ['"Noto Sans KR"', 'sans-serif'],
            display: ['"Noto Sans KR"', 'sans-serif'],
            body: ['"Noto Sans KR"', 'sans-serif'],
            label: ['"Noto Sans KR"', 'sans-serif']
          }
        },
      },
    }
  </script>
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      color: #202622;
      background-color: #FFFFFF;
      -webkit-font-smoothing: antialiased;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
    }
  </style>
</head>

<body class="bg-surface-base text-txt-main min-h-screen flex flex-col">
  <!-- Left Sidebar (216px fixed desktop width) -->
  <aside
    class="fixed left-0 top-0 h-screen w-[216px] bg-surface-base border-r border-line flex flex-col justify-between select-none z-20">
    <div class="flex flex-col">
      <!-- Brand Logo / Identity -->
      <div class="h-16 flex items-center px-6 border-b border-line">
        <span class="text-base font-bold tracking-tight text-txt-main">Project Collab</span>
      </div>
      <!-- Single Menu Item Navigation -->
      <nav class="p-3 space-y-1">
        <a class="flex items-center gap-3 px-3 py-2 text-sm font-medium text-brand bg-brand-light rounded" href="#">
          <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">folder</span>
          <span>내 프로젝트</span>
        </a>
      </nav>
    </div>
  </aside>
  <!-- Top Navigation Bar (Fixed, starts after sidebar) -->
  <header
    class="fixed top-0 left-[216px] right-0 h-16 bg-surface-base border-b border-line flex justify-end items-center px-8 z-10">
    <div class="flex items-center gap-2">
      <span class="text-sm text-txt-muted font-medium">이민지</span>
    </div>
  </header>
  <!-- Main Content Canvas -->
  <main class="ml-[216px] pt-16 min-h-screen bg-surface-base flex flex-col">
    <div class="p-8 max-w-[1224px] w-full mx-auto">
      <!-- Page Header -->
      <div class="flex items-center justify-between pb-8">
        <h1 class="text-2xl font-bold tracking-tight text-txt-main leading-none">내 프로젝트</h1>
        <button
          class="inline-flex items-center justify-center px-4 py-2.5 bg-brand hover:bg-brand-hover text-white text-sm font-medium rounded transition-colors duration-150"
          type="button">
          프로젝트 만들기
        </button>
      </div>
      <!-- Clean 3-Column Data Table -->
      <div class="w-full border border-line rounded bg-surface-base overflow-hidden">
        <table class="w-full text-left border-collapse table-fixed">
          <thead>
            <tr class="bg-surface-subtle border-b border-line h-11">
              <th class="w-[280px] px-6 text-xs font-semibold text-txt-muted tracking-normal" scope="col">프로젝트 이름</th>
              <th class="px-6 text-xs font-semibold text-txt-muted tracking-normal" scope="col">설명</th>
              <th class="w-[140px] px-6 text-xs font-semibold text-txt-muted tracking-normal text-right" scope="col">최근
                수정일</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-line text-sm">
            <tr class="h-14 hover:bg-surface-subtle transition-colors duration-150">
              <td class="px-6 py-4 font-medium truncate">
                <a class="text-txt-main hover:text-brand hover:underline underline-offset-2 transition-colors duration-150"
                  href="#">
                  결제 안정화
                </a>
              </td>
              <td class="px-6 py-4 text-txt-muted leading-relaxed truncate">
                결제 오류를 재현하고 수정 작업의 승인과 검토를 관리합니다.
              </td>
              <td class="px-6 py-4 text-txt-muted font-normal text-right whitespace-nowrap">
                2026.09.16
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</body>

</html>
