<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Project Collab</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: "#245C45",
              hover: "#1c4a37"
            },
            surface: {
              base: "#FFFFFF",
              subtle: "#F7F8F7"
            },
            content: {
              primary: "#202622",
              secondary: "#5F6661",
              muted: "#8C938E"
            },
            line: {
              DEFAULT: "#DDE2DE"
            }
          },
          borderRadius: {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          },
          fontFamily: {
            headline: ["Public Sans", "-apple-system", "BlinkMacSystemFont", "Pretendard", "sans-serif"],
            display: ["Public Sans", "-apple-system", "BlinkMacSystemFont", "Pretendard", "sans-serif"],
            body: ["Public Sans", "-apple-system", "BlinkMacSystemFont", "Pretendard", "sans-serif"],
            label: ["Public Sans", "-apple-system", "BlinkMacSystemFont", "Pretendard", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
    body {
      background-color: #F7F8F7;
      color: #202622;
      font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex justify-center min-h-screen bg-[#F7F8F7]">
<!-- 모바일 뷰포트 컨테이너 (390px) -->
<main class="w-[390px] min-h-screen bg-white flex flex-col relative border-x border-[#DDE2DE]">
<!-- 상단 앱 바 (헤더) -->
<header class="sticky top-0 z-30 flex items-center justify-between h-14 px-4 bg-white border-b border-[#DDE2DE]">
<!-- 좌측: 뒤로가기 버튼 -->
<button aria-label="작업 목록으로 이동" class="flex items-center gap-1 text-[#202622] hover:opacity-75 transition-opacity" type="button">
<span class="material-symbols-outlined text-[20px] text-[#202622]" data-icon="chevron_left">chevron_left</span>
<span class="text-sm font-medium">작업</span>
</button>
<!-- 중앙: 프로젝트명 -->
<div class="flex items-center">
<h1 class="text-sm font-semibold text-[#202622] tracking-tight">결제 안정화</h1>
</div>
<!-- 우측: 더보기 메뉴 드롭다운 영역 -->
<div class="relative">
<button aria-expanded="false" aria-label="추가 옵션" class="flex items-center justify-center w-8 h-8 text-[#202622] rounded hover:bg-[#F7F8F7] transition-colors" id="menu-button" onclick="toggleMenu()" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="more_vert">more_vert</span>
</button>
<!-- 더보기 메뉴 팝오버 -->
<div class="hidden absolute right-0 mt-1 w-32 bg-white border border-[#DDE2DE] rounded shadow-sm py-1 z-40" id="more-menu">
<button class="w-full text-left px-3 py-2 text-xs text-[#202622] hover:bg-[#F7F8F7] transition-colors" onclick="toggleMenu()" type="button">
            제안 철회
          </button>
</div>
</div>
</header>
<!-- 사용자 메타 바 -->
<div class="flex items-center justify-between px-5 py-2.5 bg-[#F7F8F7] border-b border-[#DDE2DE]">
<div class="flex items-center gap-1.5">
<span class="text-xs font-normal text-[#5F6661]">현재 사용자</span>
</div>
<span class="text-xs font-medium text-[#202622]">이민지 · 멤버</span>
</div>
<!-- 본문 상세 영역 -->
<div class="flex-1 px-5 pt-5 pb-28 flex flex-col gap-6">
<!-- 작업 헤더: 번호, 제목, 상태 -->
<section class="flex flex-col gap-3">
<div class="flex items-center justify-between">
<span class="text-xs font-semibold text-[#5F6661] tracking-wide">#102</span>
<!-- 상태 배지: 반려됨 -->
<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-[#FDE8E8] text-[#9B1C1C]">
            반려됨
          </span>
</div>
<h2 class="text-xl font-bold text-[#202622] leading-snug tracking-tight">
          결제 실패 안내 개선
        </h2>
</section>
<!-- 반려 사유 박스 -->
<section class="flex flex-col gap-2 p-3.5 bg-[#FFF8F8] border border-[#F8D7DA] rounded">
<div class="flex items-center gap-1.5 text-[#9B1C1C]">
<span class="material-symbols-outlined text-[16px]" data-icon="error_outline">error_outline</span>
<span class="text-xs font-semibold">반려 사유</span>
</div>
<p class="text-xs text-[#9B1C1C] leading-relaxed">
          완료 조건을 더 구체적으로 작성해 주세요.
        </p>
</section>
<!-- 작업 내용 섹션 -->
<section class="flex flex-col gap-2">
<h3 class="text-xs font-semibold text-[#5F6661]">
          작업 내용
        </h3>
<div class="p-3.5 bg-[#F7F8F7] rounded border border-[#DDE2DE]">
<p class="text-sm text-[#202622] leading-[1.6]">
            실패 상황별 안내 문구와 재시도 방법을 정리합니다.
          </p>
</div>
</section>
<!-- 작업 메타데이터 목록 -->
<section class="flex flex-col border-t border-[#DDE2DE] pt-4">
<dl class="flex flex-col divide-y divide-[#DDE2DE]/60 text-xs">
<div class="flex justify-between py-2.5">
<dt class="text-[#5F6661]">생성자</dt>
<dd class="font-medium text-[#202622]">이민지</dd>
</div>
<div class="flex justify-between py-2.5">
<dt class="text-[#5F6661]">담당자</dt>
<dd class="font-medium text-[#202622]">이민지 (나)</dd>
</div>
<div class="flex justify-between py-2.5">
<dt class="text-[#5F6661]">생성일</dt>
<dd class="font-medium text-[#202622]">2026.09.15</dd>
</div>
<div class="flex justify-between py-2.5">
<dt class="text-[#5F6661]">최근 수정일</dt>
<dd class="font-medium text-[#202622]">2026.09.16</dd>
</div>
</dl>
</section>
</div>
<!-- 하단 고정 액션 바 -->
<div class="fixed bottom-0 w-[390px] bg-white border-t border-[#DDE2DE] px-4 py-3 flex gap-2.5 z-30">
<button class="flex-1 h-11 bg-white border border-[#DDE2DE] text-[#202622] text-sm font-medium rounded hover:bg-[#F7F8F7] transition-colors flex items-center justify-center" type="button">
        내용 수정
      </button>
<button class="flex-1 h-11 bg-[#245C45] text-white text-sm font-medium rounded hover:bg-[#1c4a37] transition-colors flex items-center justify-center" type="button">
        다시 제출
      </button>
</div>
</main>
<script>
    function toggleMenu() {
      const menu = document.getElementById('more-menu');
      const btn = document.getElementById('menu-button');
      const isExpanded = btn.getAttribute('aria-expanded') === 'true';
      
      btn.setAttribute('aria-expanded', !isExpanded);
      menu.classList.toggle('hidden');
    }

    document.addEventListener('click', function(event) {
      const menu = document.getElementById('more-menu');
      const btn = document.getElementById('menu-button');
      if (!btn.contains(event.target) && !menu.contains(event.target)) {
        menu.classList.add('hidden');
        btn.setAttribute('aria-expanded', 'false');
      }
    });
  </script>
</body></html>
