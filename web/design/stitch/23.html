<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Project Collab</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#245C45',
              hover: '#1d4a37',
              light: '#F7F8F7',
              border: '#DDE2DE',
              text: '#202622',
              muted: '#666666'
            }
          },
          borderRadius: {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          },
          fontFamily: {
            headline: ["Noto Sans KR", "Public Sans", "sans-serif"],
            display: ["Noto Sans KR", "Public Sans", "sans-serif"],
            body: ["Noto Sans KR", "Public Sans", "sans-serif"],
            label: ["Noto Sans KR", "Public Sans", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
    body {
      font-family: 'Noto Sans KR', 'Public Sans', sans-serif;
      color: #202622;
      background-color: #FFFFFF;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="bg-white min-h-screen flex text-[#202622]">
<!-- 좌측 사이드바 (폭 216px, 고정) -->
<aside class="fixed left-0 top-0 h-screen w-[216px] bg-white border-r border-[#DDE2DE] flex flex-col justify-between select-none z-20">
<div>
<!-- 상단 브랜드 헤더 -->
<div class="px-5 py-5 border-b border-[#DDE2DE]">
<h1 class="text-base font-bold text-[#202622] tracking-tight leading-none font-headline">Project Collab</h1>
<p class="text-xs text-[#666666] mt-1.5 font-normal leading-none font-label">업무 협업 도구</p>
</div>
<!-- 내비게이션 영역 (권한 부재 시 간결한 내비게이션 구조) -->
<nav class="p-3">
<a class="flex items-center gap-2.5 px-3 py-2 text-sm text-[#245C45] font-medium rounded hover:bg-[#F7F8F7] transition-colors duration-150" href="#">
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_back">arrow_back</span>
<span>내 프로젝트로</span>
</a>
</nav>
</div>
</aside>
<!-- 메인 작업 영역 컨테이너 (사이드바 폭 216px 확보) -->
<div class="flex-1 ml-[216px] flex flex-col min-h-screen bg-[#F7F8F7]">
<!-- 상단 머리글 (높이 64px) -->
<header class="h-16 bg-white border-b border-[#DDE2DE] px-8 flex items-center justify-between sticky top-0 z-10">
<div class="flex items-center">
<span class="text-base font-medium text-[#202622]">프로젝트 개요</span>
</div>
<!-- 우측 사용자 정보 표시 -->
<div class="flex items-center gap-2">
<div class="w-7 h-7 rounded-full bg-[#F7F8F7] border border-[#DDE2DE] flex items-center justify-center text-xs text-[#202622] font-medium">
          이
        </div>
<span class="text-sm text-[#202622] font-normal">이민지</span>
</div>
</header>
<!-- 본문 콘텐츠 영역 (32px 패딩, 정갈한 중앙 정렬 안내) -->
<main class="flex-1 p-8 flex items-center justify-center">
<div class="w-full max-w-[480px] bg-white border border-[#DDE2DE] rounded p-12 flex flex-col items-center text-center shadow-none">
<!-- 권한 제한 심볼 아이콘 -->
<div class="w-14 h-14 rounded-full bg-[#F7F8F7] border border-[#DDE2DE] flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-[#202622] text-[28px]" data-icon="lock">lock</span>
</div>
<!-- 안내 타이틀 -->
<h2 class="text-2xl font-bold text-[#202622] tracking-tight mb-3 font-headline leading-tight">
          프로젝트에 접근할 권한이 없습니다.
        </h2>
<!-- 보조 설명 문구 -->
<p class="text-[15px] text-[#666666] leading-relaxed mb-8 font-normal">
          현재 참여 중인 프로젝트를 확인해 주세요.
        </p>
<!-- 단일 주요 행동 버튼 (CTA) -->
<a class="inline-flex items-center justify-center px-6 py-2.5 bg-[#245C45] hover:bg-[#1d4a37] text-white text-sm font-medium rounded transition-colors duration-150 leading-normal" href="#">
          내 프로젝트로
        </a>
</div>
</main>
</div>
</body></html>
