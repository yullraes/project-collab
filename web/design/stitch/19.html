<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Project Collab</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;family=Public+Sans:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#245C45',
              hover: '#1b4735',
              surface: '#EBF3EF',
              border: '#245C45'
            },
            neutral: {
              main: '#202622',
              secondary: '#5C6660',
              muted: '#8A948E',
              line: '#DDE2DE',
              surface: '#F7F8F7'
            }
          },
          borderRadius: {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          },
          fontFamily: {
            headline: ["Noto Sans KR", "Public Sans", "sans-serif"],
            display: ["Noto Sans KR", "Public Sans", "sans-serif"],
            body: ["Noto Sans KR", "Public Sans", "sans-serif"],
            label: ["Noto Sans KR", "Public Sans", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
    body {
      font-family: 'Noto Sans KR', 'Public Sans', sans-serif;
      color: #202622;
      background-color: #FFFFFF;
      -webkit-font-smoothing: antialiased;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
      vertical-align: middle;
    }
  </style>
</head>
<body class="bg-white text-neutral-main min-h-screen">
<div class="flex w-full min-h-screen">
<!-- 왼쪽 고정 사이드바 (216px) -->
<aside class="fixed left-0 top-0 h-screen w-[216px] bg-white border-r border-[#DDE2DE] flex flex-col justify-between p-4 select-none z-20">
<div class="flex flex-col">
<!-- 브랜드 헤더 -->
<div class="mb-5 pb-4 border-b border-[#DDE2DE]">
<div class="text-base font-headline font-bold text-[#202622] tracking-tight">Project Collab</div>
<div class="text-xs text-[#5C6660] mt-0.5">업무 협업 도구</div>
</div>
<!-- 상단 내비게이션 링크: 뒤로가기 -->
<div class="mb-5">
<a class="inline-flex items-center gap-1.5 text-xs text-[#5C6660] hover:text-[#245C45] transition-colors duration-150" href="#">
<span class="material-symbols-outlined text-[16px]">arrow_back</span>
<span>내 프로젝트로</span>
</a>
</div>
<!-- 현재 프로젝트 구분 블록 -->
<div class="mb-4">
<div class="text-[11px] font-medium text-[#8A948E] tracking-wider mb-1">현재 프로젝트</div>
<div class="text-sm font-semibold text-[#202622] truncate">결제 안정화</div>
</div>
<!-- 프로젝트 내비게이션 메뉴 목록 -->
<nav class="flex flex-col gap-1">
<a class="flex items-center gap-2.5 px-3 py-2 text-sm text-[#5C6660] hover:bg-[#F7F8F7] hover:text-[#202622] rounded transition-colors duration-150" href="#">
<span class="material-symbols-outlined text-[18px]">check_box</span>
<span>작업</span>
</a>
<a class="flex items-center gap-2.5 px-3 py-2 text-sm text-[#5C6660] hover:bg-[#F7F8F7] hover:text-[#202622] rounded transition-colors duration-150" href="#">
<span class="material-symbols-outlined text-[18px]">group</span>
<span>멤버</span>
</a>
<!-- 활성화(Selected/Active) 상태 -->
<a class="flex items-center gap-2.5 px-3 py-2 text-sm font-semibold text-[#245C45] bg-[#EBF3EF] rounded transition-colors duration-150" href="#">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">settings</span>
<span>설정</span>
</a>
</nav>
</div>
</aside>
<!-- 메인 레이아웃 (사이드바 폭 216px 제외) -->
<div class="ml-[216px] flex-1 flex flex-col min-w-0">
<!-- 상단 헤더 (높이 64px) -->
<header class="fixed top-0 left-[216px] right-0 h-16 bg-white border-b border-[#DDE2DE] flex items-center justify-between px-8 z-10">
<div>
<h1 class="text-lg font-headline font-bold text-[#202622] leading-none">프로젝트 개요</h1>
</div>
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-[#245C45]"></span>
<span class="text-sm font-medium text-[#202622]">김서연 · 소유자</span>
</div>
</header>
<!-- 본문 영역 (패딩 32px, 헤더 높이 64px 반영) -->
<main class="flex-1 mt-16 p-8 bg-white">
<div class="max-w-[760px]">
<!-- 페이지 제목 -->
<h2 class="text-2xl font-bold font-headline text-[#202622] mb-8">프로젝트 설정</h2>
<!-- 기본 정보 폼 섹션 -->
<form class="space-y-6" onsubmit="return false;">
<div>
<label class="block text-sm font-medium text-[#202622] mb-2" for="project-name">
                프로젝트 이름 <span class="text-[#245C45]">*</span>
</label>
<input class="w-full h-11 px-3.5 bg-white border border-[#DDE2DE] rounded text-sm text-[#202622] focus:outline-none focus:border-[#245C45] transition-colors duration-150" id="project-name" name="project-name" type="text" value="결제 안정화"/>
</div>
<div>
<label class="block text-sm font-medium text-[#202622] mb-2" for="project-description">
                프로젝트 설명 <span class="text-[#245C45]">*</span>
</label>
<textarea class="w-full p-3 bg-white border border-[#DDE2DE] rounded text-sm text-[#202622] leading-relaxed focus:outline-none focus:border-[#245C45] transition-colors duration-150 resize-y" id="project-description" name="project-description" rows="4">결제 오류를 재현하고 수정 작업의 승인과 검토를 관리합니다.</textarea>
</div>
<!-- 프로젝트 메타 일자 정보 -->
<div class="flex items-center gap-6 pt-1 text-xs text-[#5C6660]">
<span>생성일: 2026.09.15</span>
<span class="w-1 h-1 rounded-full bg-[#DDE2DE]"></span>
<span>최근 수정일: 2026.09.16</span>
</div>
<!-- 저장 버튼 -->
<div class="pt-2">
<button class="px-5 h-10 bg-[#245C45] hover:bg-[#1b4735] text-white text-sm font-medium rounded transition-colors duration-150 inline-flex items-center justify-center" type="button">
                변경사항 저장
              </button>
</div>
</form>
<!-- 구분선 -->
<hr class="my-10 border-0 border-t border-[#DDE2DE]"/>
<!-- 프로젝트 삭제 (위험 영역) 섹션 -->
<section>
<h3 class="text-base font-semibold text-[#202622] mb-1.5">프로젝트 삭제</h3>
<p class="text-sm text-[#5C6660] mb-4">
              프로젝트의 모든 작업과 멤버 정보가 함께 삭제됩니다.
            </p>
<button class="px-4 h-9 border border-[#B3261E] text-[#B3261E] hover:bg-[#FDF2F2] text-sm font-medium rounded transition-colors duration-150 inline-flex items-center justify-center" type="button">
              프로젝트 삭제
            </button>
</section>
</div>
</main>
</div>
</div>
</body></html>
